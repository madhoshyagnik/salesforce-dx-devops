name: salesforce-dx-devops

services:
  jenkins:
    build:
      context: .
      dockerfile: docker/Dockerfile.jenkins
    container_name: salesforce-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - TZ=UTC
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
